name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # STAGE 1: Build & Push Docker Image ke GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # STAGE 2: Automated Deploy ke VPS K3s via SSH
  # ==========================================
  deploy-to-vps:
    name: Deploy to Production K3s VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Pindah ke direktori manifest Kubernetes di VPS
            cd /opt/k8s-ukk

            # 2. Hapus cache image lama di node VPS agar K3s mendownload image build terbaru
            crictl rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

            # 3. Terapkan konfigurasi manifest baru (Secrets, ConfigMap, Deployments)
            kubectl apply -f 01-secrets-configmap.yaml
            kubectl apply -f 04-laravel.yaml

            # 4. Trigger rolling update pod aplikasi dan worker
            kubectl rollout restart deployment/laravel-app -n ukk-production
            kubectl rollout restart deployment/laravel-worker -n ukk-production

            # 5. Tunggu proses deployment sampai status Ready (1/1 Running)
            kubectl rollout status deployment/laravel-app -n ukk-production --timeout=180s

            # 6. Jalankan migrasi database produksi secara otomatis
            kubectl exec -n ukk-production deployment/laravel-app -- php artisan migrate --force
